name: Gerar visuais de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#12352B&color_dots=#F2E8D5,#B9C7B4,#4A5C52,#1C4A3D,#12352B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFC83D&color_dots=#1C4A3D,#4A5C52,#B9C7B4,#F2E8D5,#FFC83D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      - name: Recolorir os cards na paleta da marca
        run: |
          git pull --ff-only origin main
          bash .github/scripts/recolorir-cards.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/felip
          if git diff --cached --quiet; then echo "Nada mudou."; else git commit -m "chore: recolorir cards de resumo" && git push; fi
