name: Ícones e cards dos repositórios

# Roda a cada 6 horas: todo repositório público novo ganha ícone e card
# na identidade do felip.cloud e entra sozinho na seção de projetos do README.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/brand/**"
      - ".github/workflows/marca.yml"

permissions:
  contents: write

concurrency:
  group: marca
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci --prefix .github/brand

      - name: Gerar banner, botões, ícones e cards
        run: node .github/brand/gerar.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL: ${{ github.repository_owner }}

      - name: Publicar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore(marca): atualizar ícones e cards dos repositórios"
            git push
          fi
